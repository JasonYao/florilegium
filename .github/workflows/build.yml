name: build
on:
  push:
    branches: ['**', '!main', '!core-patchset']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Every action is pinned to a full commit SHA (the version is in the comment beside it);
# Dependabot proposes new ones once a month. Jobs get only the permissions they need.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # florilegium-svg.lua must draw the same page under every Lua (texlua, 5.3, 5.4 and the playground's
  # wasmoon); a few seconds, so a pull request hears about a broken page first. Before that,
  # florilegium.sty and every Lua file must name the same release, and on a v* tag the tag's,
  # so that no release is drafted from files that say another version.
  lua:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: every file names the same release (on a tag, the tag's)
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: tools/versioncheck.sh ${TAG:+"$TAG"}
      - name: install Lua 5.3 and 5.4
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.3 lua5.4 > /dev/null
      - name: the same pages under both
        run: tools/svgcheck.sh lua5.3 lua5.4

  # The four documents, which a release carries, and three pages that are only checked: the
  # specimen sheets and the ornaments draw through \florilegiumdraw and \florilegiumornament,
  # which read pgf's transform from its internal macros (florilegium.lua: sync_transform), so a
  # pgf that renamed them would fail here and not in someone's document.
  pdfs:
    outputs:
      test-artifact-url: ${{ steps.test-results.outputs.artifact-url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the documents, specimen sheets and ornaments (lualatex)
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: |
            florilegium.tex
            florilegium-grow.tex
            showcase.tex
            spread.tex
            specimen.tex
            specimen-geometric.tex
            ornaments.tex
            tests/regions.tex
          latexmk_use_lualatex: true
      - name: render previews of every built PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils > /dev/null
          mkdir -p test-previews
          for pdf in florilegium.pdf florilegium-grow.pdf showcase.pdf spread.pdf \
                     specimen.pdf specimen-geometric.pdf ornaments.pdf; do
            pdftoppm -f 1 -l 1 -singlefile -png -scale-to 900 "$pdf" "test-previews/${pdf%.pdf}"
          done
          region_cases=(single-rectangle disjoint-rectangles overlapping-rectangles \
                        single-polygon disjoint-polygons overlapping-polygons)
          for i in "${!region_cases[@]}"; do
            page=$((i + 1))
            pdftoppm -f "$page" -l "$page" -singlefile -png -scale-to 900 \
              regions.pdf "test-previews/regions-${region_cases[$i]}"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: florilegium-pdfs
          if-no-files-found: error
          path: |
            florilegium.pdf
            florilegium-grow.pdf
            showcase.pdf
            spread.pdf
      - id: test-results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-test-results
          if-no-files-found: warn
          path: |
            florilegium.pdf
            florilegium-grow.pdf
            showcase.pdf
            spread.pdf
            specimen.pdf
            specimen-geometric.pdf
            ornaments.pdf
            regions.pdf
            test-previews/*.png

  # A branch push also posts the check results on its matching open pull request.
  # Only this job may write comments; build jobs remain read-only.
  pr-results:
    needs: [lua, pdfs]
    if: always() && github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != 'main' && github.ref_name != 'core-patchset'
    runs-on: ubuntu-latest
    outputs:
      test-artifact-url: ${{ needs.pdfs.outputs.test-artifact-url }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.pdfs.result == 'success'
        with:
          name: build-test-results
          path: build/test-results
      - name: report test results on the matching open pull request
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_ACCESS_TOKEN }}
          GITHUB_UPLOAD_TOKEN: ${{ secrets.DEPLOY_ACCESS_TOKEN }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
          LUA_RESULT: ${{ needs.lua.result }}
          PDF_RESULT: ${{ needs.pdfs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TEST_ARTIFACT_URL: ${{ needs.pdfs.outputs.test-artifact-url }}
          TEST_RESULTS_DIR: build/test-results
        run: tools/comment-pr-results.sh

  # A release starts with a tag: git tag -a v1.3 -m v1.3 && git push origin v1.3, after a
  # commit that sets the version everywhere (CLAUDE.md, Releases); the lua job stops a tag
  # that florilegium.sty and the Lua files don't agree with. This job
  # signs a build provenance attestation for the PDFs built from that tag and opens a draft
  # release with them attached, along with the attestation itself as
  # florilegium-pdfs.sigstore.json. The notes are written by hand, and publishing the draft
  # makes the release immutable. Check a PDF with
  #   gh attestation verify florilegium.pdf --repo kevinraymond/florilegium
  # and add --bundle florilegium-pdfs.sigstore.json to check it against the attached file
  # instead of GitHub's copy. OpenSSF Scorecard counts a release as signed by that file.
  # The only job that may write.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lua, pdfs]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write           # create the draft release
      id-token: write           # sign the attestation (Sigstore, through GitHub's OIDC token)
      attestations: write       # store it
      artifact-metadata: write  # record the PDFs it covers
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: florilegium-pdfs
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '*.pdf'
      - name: a draft release with the PDFs and their attestation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" florilegium-pdfs.sigstore.json
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" ./*.pdf florilegium-pdfs.sigstore.json --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" ./*.pdf florilegium-pdfs.sigstore.json --draft --verify-tag \
              --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: render six seeds
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # 4.1.0
        with:
          root_file: gallery.tex
          latexmk_use_lualatex: true
          extra_system_packages: python3 py3-pillow poppler-utils
          post_compile: >-
            python3 tools/gallery.py --seeds 1 2 3 4 5 6 --jobs 2 &&
            python3 tools/gallery.py --seed 6 --inks 2456C4 5B2A1F 2F6B4F 8E1B3A 4B3B8F 1D6E7A --jobs 2 &&
            python3 tools/gallery.py --seed 6 --ages 0 0.33 0.67 1 --jobs 2 &&
            python3 tools/gallery.py --seed 6 --themes flora geometric math --jobs 2 &&
            python3 tools/gallery.py --seed 6 --options density=1 density=0.5 density=0.2 density=0.05 intensity=0.5 --jobs 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gallery
          path: gallery/
